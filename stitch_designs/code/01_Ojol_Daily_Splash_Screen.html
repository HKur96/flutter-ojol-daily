<div class="flex flex-col items-center gap-3">

<svg class="animate-spin w-6 h-6 text-primary" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

</svg>

      </span>
</div>

<div class="w-full flex justify-center pb-2">

<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-60"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</span>

      </p>
</div>
</div>
</div>
<script>
  (function() {
    const statusMessages = [
      "Menyiapkan data...",
      "Memeriksa buku kas lokal...",
      "Sinkronisasi pangkalan...",
      "Siap digunakan"
    ];
    let step = 0;
    const statusLabel = document.getElementById('splash-status-text');
    
    if (statusLabel) {
      const interval = setInterval(() => {
        step++;
        if (step < statusMessages.length) {
          statusLabel.textContent = statusMessages[step];
        } else {
          clearInterval(interval);
        }
      }, 750);
    }
  })();
